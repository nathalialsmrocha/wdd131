<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Produto</title>

    <meta name="description"
        content="Formulário de revisão de produto para registrar avaliações, classificações e recursos úteis dos produtos.">
    <meta name="author" content="Nathália L. S. Monte Rocha">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos/formulario.css">

    <script src="scripts/formulario.js" defer></script>
</head>

<body>

    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
        <form method="get" action="avaliacao.html">

            <!-- Nome do Produto -->
            <label for="produto">Nome do Produto:</label>
            <select id="produto" name="produto" required>
                <option value="" disabled selected>Selecione um Produto...</option>
            </select>

            <!-- Classificação Geral -->
            <fieldset>
                <legend>Classificação Geral</legend>

                <label for="classificacao1">
                    <input type="radio" id="classificacao1" name="classificacao" value="1" required>
                    ☆
                </label>

                <label for="classificacao2">
                    <input type="radio" id="classificacao2" name="classificacao" value="2">
                    ☆☆
                </label>

                <label for="classificacao3">
                    <input type="radio" id="classificacao3" name="classificacao" value="3">
                    ☆☆☆
                </label>

                <label for="classificacao4">
                    <input type="radio" id="classificacao4" name="classificacao" value="4">
                    ☆☆☆☆
                </label>

                <label for="classificacao5">
                    <input type="radio" id="classificacao5" name="classificacao" value="5">
                    ☆☆☆☆☆
                </label>
            </fieldset>

            <!-- Data de Instalação -->
            <label for="dataInstalacao">Data de Instalação:</label>
            <input type="date" id="dataInstalacao" name="dataInstalacao" required>

            <!-- Recursos Úteis -->
            <fieldset>
                <legend>Recursos Úteis</legend>

                <label for="facilInstalacao">
                    <input type="checkbox" id="facilInstalacao" name="recursos" value="fácil instalação">
                    Fácil instalação
                </label>

                <label for="manual">
                    <input type="checkbox" id="manual" name="recursos" value="manual">
                    Manual de instruções
                </label>

                <label for="suporte">
                    <input type="checkbox" id="suporte" name="recursos" value="suporte">
                    Suporte técnico
                </label>

                <label for="garantia">
                    <input type="checkbox" id="garantia" name="recursos" value="garantia">
                    Garantia
                </label>
            </fieldset>

            <!-- Avaliação Escrita -->
            <label for="avaliacao">Avaliação Escrita:</label>
            <textarea id="avaliacao" name="avaliacao" rows="5" cols="40"
                placeholder="Escreva sua avaliação sobre o produto..."></textarea>

            <!-- Nome de Usuário -->
            <label for="nomeUsuario">Nome de Usuário:</label>
            <input type="text" id="nomeUsuario" name="nomeUsuario">

            <!-- Botão Enviar -->
            <input type="submit" value="Enviar Avaliação">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Avaliação de Produto</p>
    </footer>

</body>

</html>
