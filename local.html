<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil</title>
    <meta name="description" content="Página sobre o Brasil com informações gerais, imagens e dados climáticos.">
    <meta name="author" content="Nathália Dumont">

    <link rel="stylesheet" href="estilos/local.css">

    <script src="scripts/local.js" defer></script>
</head>

<body>

    <header>
        <h1>Brasil</h1>
    </header>

    <main>

        <picture class="hero">
            <source media="(min-width: 1500px)" srcset="imagens/brasilgrande.webp">
            <source media="(min-width: 700px)" srcset="imagens/brasilmedio.webp">
            <img src="imagens/brasilpequeno.webp" alt="Paisagem do Brasil">
        </picture>

        <section class="dados">

            <h2>Dados do País</h2>

            <p><strong>Capital:</strong> Brasília</p>
            <p><strong>População:</strong> 203 milhões</p>
            <p><strong>Idioma:</strong> Português</p>
            <p><strong>Moeda:</strong> Real</p>

        </section>

        <section class="clima">

            <h2>Clima</h2>

            <img src="imagens/clima.svg" alt="Ícone do clima">

            <p><strong>Temperatura:</strong> <span id="temperatura">8</span>°C</p>

            <p><strong>Velocidade do vento:</strong> <span id="vento">10</span> km/h</p>

            <p><strong>Sensação térmica:</strong> <span id="sensacao"></span></p>

        </section>

    </main>

    <footer>

        <p>© <span id="ano"></span> Brasil</p>

        <p>Última atualização: <span id="modificado"></span></p>

    </footer>

</body>

</html>
